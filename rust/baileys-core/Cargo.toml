[package]
name = "baileys-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.9"
aes = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = { version = "4.1", features = ["digest"] }
ed25519-dalek = "2.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
prost = "0.13"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1.10", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
qrcode = "0.14"
ctr = "0.9"
hex = "0.4"
pbkdf2 = "0.12"
md-5 = "0.10"
flate2 = "1.0"
