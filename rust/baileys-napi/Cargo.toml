[package]
name = "baileys-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# existing deps...
napi = { version = "2", features = ["tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
baileys-core = { path = "../baileys-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3.33"
futures-macro = "0.3.33"
