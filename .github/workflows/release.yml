name: Cross-Platform Native Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Native on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output_name: baileys_napi.win32-x64-msvc.node
            artifact_name: win32-x64-msvc
          # Linux x64 (glibc / Ubuntu / Debian / CentOS / Docker)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output_name: baileys_napi.linux-x64-gnu.node
            artifact_name: linux-x64-gnu
          # macOS Intel x64
          - os: macos-13
            target: x86_64-apple-darwin
            output_name: baileys_napi.darwin-x64.node
            artifact_name: darwin-x64
          # macOS Apple Silicon ARM64 (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            output_name: baileys_napi.darwin-arm64.node
            artifact_name: darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Node Dependencies
        run: bun install

      - name: Build Native Addon (Release)
        env:
          RUSTFLAGS: ${{ runner.os == 'macOS' && '-C link-arg=-undefined -C link-arg=dynamic_lookup' || '' }}
        run: cargo build --manifest-path rust/Cargo.toml --package baileys-napi --release --target ${{ matrix.target }}

      - name: Prepare Binary Artifact
        shell: bash
        run: |
          mkdir -p dist-binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp rust/target/${{ matrix.target }}/release/baileys_napi.dll dist-binaries/${{ matrix.output_name }}
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp rust/target/${{ matrix.target }}/release/libbaileys_napi.dylib dist-binaries/${{ matrix.output_name }}
          else
            cp rust/target/${{ matrix.target }}/release/libbaileys_napi.so dist-binaries/${{ matrix.output_name }}
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-binaries/${{ matrix.output_name }}

      - name: Run Test Suite (Local Runner Target)
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          cp dist-binaries/${{ matrix.output_name }} ./baileys_napi.node
          bun test
