name: Cross-Platform Native Build & Release

on:
  push:
    branches: [main, 'ci-test/*']
    tags: ['v*.*.*', 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Native on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x64 (MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output_name: baileys-napi.win32-x64-msvc.node
            artifact_name: win32-x64-msvc
            test_local: true

          # 2. Linux x64 glibc (Ubuntu / Debian / CentOS / VPS)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output_name: baileys-napi.linux-x64-gnu.node
            artifact_name: linux-x64-gnu
            test_local: true

          # 3. Linux x64 musl (Alpine Linux / Docker)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            output_name: baileys-napi.linux-x64-musl.node
            artifact_name: linux-x64-musl
            test_local: false
            setup_musl: true

          # 4. macOS Intel x64 (Cross-compiled via Apple Clang on macos-latest)
          - os: macos-latest
            target: x86_64-apple-darwin
            output_name: baileys-napi.darwin-x64.node
            artifact_name: darwin-x64
            test_local: false

          # 5. macOS Apple Silicon ARM64 (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            output_name: baileys-napi.darwin-arm64.node
            artifact_name: darwin-arm64
            test_local: true

          # 6. Linux ARM64 glibc (Raspberry Pi / ARM VPS)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            output_name: baileys-napi.linux-arm64-gnu.node
            artifact_name: linux-arm64-gnu
            test_local: false
            setup_aarch64: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Cross-Toolchains (musl / aarch64)
        if: runner.os == 'Linux' && (matrix.setup_musl || matrix.setup_aarch64)
        run: |
          sudo apt-get update
          if [ "${{ matrix.setup_musl }}" = "true" ]; then
            sudo apt-get install -y musl-tools
          fi
          if [ "${{ matrix.setup_aarch64 }}" = "true" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Install Rust Toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Native Addon (Release)
        env:
          RUSTFLAGS: ${{ runner.os == 'macOS' && '-C link-arg=-undefined -C link-arg=dynamic_lookup' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.setup_aarch64 && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.setup_aarch64 && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ matrix.setup_aarch64 && 'aarch64-linux-gnu-g++' || '' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.setup_musl && 'musl-gcc' || '' }}
          CC_x86_64_unknown_linux_musl: ${{ matrix.setup_musl && 'musl-gcc' || '' }}
        run: cargo build --manifest-path rust/Cargo.toml --package baileys-napi --release --target ${{ matrix.target }}

      - name: Prepare Binary Artifact
        shell: bash
        run: |
          mkdir -p dist-binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp rust/target/${{ matrix.target }}/release/baileys_napi.dll dist-binaries/${{ matrix.output_name }}
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp rust/target/${{ matrix.target }}/release/libbaileys_napi.dylib dist-binaries/${{ matrix.output_name }}
          else
            cp rust/target/${{ matrix.target }}/release/libbaileys_napi.so dist-binaries/${{ matrix.output_name }}
          fi
          echo "Built binary size:"
          ls -lh dist-binaries/${{ matrix.output_name }}

      - name: Run Test Suite on Host Runner
        if: matrix.test_local == true
        shell: bash
        run: |
          cp dist-binaries/${{ matrix.output_name }} ./baileys-napi.node
          npm run test:node

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-binaries/${{ matrix.output_name }}

  release:
    name: Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Native Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize Release Binaries
        run: |
          mkdir -p release-dist
          find all-artifacts -type f -name "*.node" -exec cp {} release-dist/ \;
          echo "=== Release Binaries Staged ==="
          ls -lh release-dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*.node
          generate_release_notes: true
          draft: false
          prerelease: false
